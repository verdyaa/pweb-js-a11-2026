<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — DEERA.</title>
  <meta name="description" content="Create a DEERA account to enjoy exclusive deals, seamless shopping, and fast checkout on everyday essentials.">

  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Native Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <!-- External JS loaded with defer per praktikum requirements -->
  <script src="assets/js/signup.js" defer></script>
</head>
<body>

  <main class="auth-page-wrapper">
    <!-- Left Column: Lifestyle Visual & DEERA Branding -->
    <div class="auth-visual-col">
      <a href="index.html" class="auth-brand-logo" aria-label="DEERA Homepage">DEERA.</a>
      <div class="auth-visual-img-wrap">
        <img src="assets/images/auth-chair.png" alt="DEERA Everyday Essentials Store" class="auth-visual-img" fetchpriority="high">
      </div>
      <div style="font-size: 13px; color: var(--color-secondary);">
        &copy; 2026 DEERA Store. All rights reserved.
      </div>
    </div>

    <!-- Right Column: Sign Up Form (Figma 'Sign Up Popup' Specification) -->
    <div class="auth-form-col">
      <div class="auth-form-container">
        <div class="auth-header">
          <h1 class="auth-title">Sign up</h1>
          <p class="auth-subtitle">
            Already have an account? <a href="login.html" class="accent-link">Sign in</a>
          </p>
        </div>

        <!-- Visual Error / Success Alert Box -->
        <div id="authAlert" class="auth-alert" role="alert" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="alertMessage">Notification message</span>
        </div>

        <!-- Sign Up Form -->
        <form id="signupForm" novalidate>
          <!-- Full Name Field -->
          <div class="form-group">
            <label for="nameInput" class="form-label">Your name</label>
            <div class="form-input-wrap">
              <input 
                type="text" 
                id="nameInput" 
                class="form-input" 
                placeholder="Your name" 
                required 
                autocomplete="name"
              >
            </div>
          </div>

          <!-- Username Field -->
          <div class="form-group">
            <label for="usernameInput" class="form-label">Username</label>
            <div class="form-input-wrap">
              <input 
                type="text" 
                id="usernameInput" 
                class="form-input" 
                placeholder="Username" 
                required 
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Email Address Field -->
          <div class="form-group">
            <label for="emailInput" class="form-label">Email address</label>
            <div class="form-input-wrap">
              <input 
                type="email" 
                id="emailInput" 
                class="form-input" 
                placeholder="Email address" 
                required 
                autocomplete="email"
              >
            </div>
          </div>

          <!-- Password Field with Show/Hide Toggle -->
          <div class="form-group">
            <label for="passwordInput" class="form-label">Password</label>
            <div class="form-input-wrap">
              <input 
                type="password" 
                id="passwordInput" 
                class="form-input" 
                placeholder="Password" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms Agreement Checkbox -->
          <div class="form-checkbox-row" style="margin-bottom: 24px;">
            <label class="checkbox-label">
              <input type="checkbox" id="termsCheckbox">
              <span style="font-size: 13px; color: var(--color-secondary);">
                I agree with <strong style="color: var(--color-primary); font-weight: 600;">Privacy Policy</strong> and <strong style="color: var(--color-primary); font-weight: 600;">Terms of Use</strong>
              </span>
            </label>
          </div>

          <!-- Submit Button with Loading Spinner -->
          <button type="submit" id="submitSignupBtn" class="btn btn-primary btn-lg w-100">
            <span id="btnText">Sign Up</span>
            <span id="btnSpinner" style="display: none; align-items: center; gap: 8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin-animation">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
              </svg>
              Creating account...
            </span>
          </button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
          <a href="index.html" style="font-size: 13px; color: var(--color-secondary); display: inline-flex; align-items: center; gap: 4px;">
            &larr; Back to Homepage
          </a>
        </div>
      </div>
    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — DEERA.</title>
  <meta name="description" content="Sign in to your DEERA account to access your orders, wishlist, and exclusive discounts.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</head>
<body>

  <main class="auth-page-wrapper">

    <div class="auth-visual-col">
      <a href="index.html" class="auth-brand-logo" aria-label="DEERA Homepage">DEERA.</a>
      <div class="auth-visual-img-wrap">
        <img src="assets/images/auth-chair.png" alt="DEERA Everyday Essentials Store" class="auth-visual-img" fetchpriority="high">
      </div>
      <div style="font-size: 13px; color: var(--color-secondary);">
        &copy; 2026 DEERA Store. All rights reserved.
      </div>
    </div>

    <div class="auth-form-col">
      <div class="auth-form-container">
        <div class="auth-header">
          <h1 class="auth-title">Sign In</h1>
          <p class="auth-subtitle">
            Don't have an account yet? <a href="signup.html" class="accent-link">Sign Up</a>
          </p>
        </div>

        <div id="authAlert" class="auth-alert" role="alert">
          <svg id="alertIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="alertMessage">Error message</span>
        </div>

        <form id="loginForm" novalidate>

          <div class="form-group">
            <label for="usernameInput" class="form-label">Username</label>
            <div class="form-input-wrap">
              <input 
                type="text" 
                id="usernameInput" 
                class="form-input" 
                placeholder="Your username or email" 
                required 
                autocomplete="username"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="passwordInput" class="form-label">Password</label>
            <div class="form-input-wrap">
              <input 
                type="password" 
                id="passwordInput" 
                class="form-input" 
                placeholder="Password" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" checked>
              <span>Remember me</span>
            </label>
            <a href="#" style="font-weight: 500; color: var(--color-primary);" onclick="alert('Forgot password placeholder.'); return false;">Forgot password?</a>
          </div>

          <button type="submit" id="submitLoginBtn" class="btn btn-primary btn-lg w-100">
            <span id="btnText">Sign In</span>
            <span id="btnSpinner" style="display: none; align-items: center; gap: 8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin-animation">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
              </svg>
              Verifying credentials...
            </span>
          </button>
        </form>

        <div class="demo-accounts-box">
          <div class="demo-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            Quick Test Accounts (DummyJSON Users API):
          </div>
          <p style="color: var(--color-secondary); font-size: 12px; margin-bottom: 8px;">
            Click any account chip below to auto-fill valid credentials:
          </p>
          <div class="demo-chips">
            <button type="button" class="demo-chip-btn" onclick="fillCredentials('emilys', 'emilyspass')">
              <strong>Emily Johnson</strong> (emilys)
            </button>
            <button type="button" class="demo-chip-btn" onclick="fillCredentials('michaelw', 'michaelwpass')">
              <strong>Michael Williams</strong> (michaelw)
            </button>
            <button type="button" class="demo-chip-btn" onclick="fillCredentials('sophiab', 'sophiabpass')">
              <strong>Sophia Brown</strong> (sophiab)
            </button>
          </div>
        </div>

        <div style="margin-top: 24px; text-align: center;">
          <a href="index.html" style="font-size: 13px; color: var(--color-secondary); display: inline-flex; align-items: center; gap: 4px;">
            &larr; Back to Homepage
          </a>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
